# Despliegue de PIAR en Render (https://render.com) con un clic.
# Crea el servicio web (Node + frontend) y una base de datos PostgreSQL gestionada.
services:
  - type: web
    name: piar
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render genera una clave segura automáticamente
      - key: DATABASE_URL
        fromDatabase:
          name: piar-db
          property: connectionString

databases:
  - name: piar-db
    plan: free
    databaseName: piar
    user: piar
