services:
  db:
    image: postgres:16-alpine
    container_name: sigpiar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigpiar
      POSTGRES_PASSWORD: sigpiar
      POSTGRES_DB: sigpiar
    ports:
      - "5432:5432"
    volumes:
      - sigpiar_pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  sigpiar_pgdata:
