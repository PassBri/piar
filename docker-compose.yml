services:
  db:
    image: postgres:16-alpine
    container_name: piar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: piar
      POSTGRES_PASSWORD: piar
      POSTGRES_DB: piar
    ports:
      - "5432:5432"
    volumes:
      - piar_pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./server/db/simulacion.sql:/docker-entrypoint-initdb.d/03-simulacion.sql:ro

volumes:
  piar_pgdata:
