<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SIGPIAR">
  <defs>
    <linearGradient id="pollito" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECEFF1"/>
      <stop offset="1" stop-color="#CFD8DC"/>
    </linearGradient>
    <linearGradient id="nido" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#607D8B"/>
      <stop offset="1" stop-color="#37474F"/>
    </linearGradient>
  </defs>
  <!-- Pollito -->
  <g>
    <!-- cuerpo -->
    <ellipse cx="60" cy="52" rx="23" ry="24" fill="url(#pollito)" stroke="#90A4AE" stroke-width="1.5"/>
    <!-- cabeza / copete -->
    <path d="M52 30 q3 -7 8 -3 q5 -4 8 3" fill="none" stroke="#90A4AE" stroke-width="3" stroke-linecap="round"/>
    <!-- alita -->
    <path d="M60 50 q12 4 15 16 q-10 2 -16 -6 z" fill="#CFD8DC" stroke="#90A4AE" stroke-width="1.2"/>
    <!-- ojo -->
    <circle cx="68" cy="45" r="3.2" fill="#37474F"/>
    <circle cx="69.1" cy="44" r="1" fill="#ECEFF1"/>
    <!-- pico -->
    <path d="M82 48 l10 -3 l-9 7 z" fill="#C9A227"/>
  </g>
  <!-- Nido -->
  <g>
    <path d="M22 72 q38 26 76 0 q4 20 -14 28 q-24 9 -48 0 q-18 -8 -14 -28 z" fill="url(#nido)"/>
    <!-- ramitas del nido -->
    <g stroke="#CFD8DC" stroke-width="1.3" stroke-linecap="round" opacity="0.65" fill="none">
      <path d="M28 82 q30 14 64 0"/>
      <path d="M30 90 q30 12 60 0"/>
      <path d="M34 98 q26 8 52 0"/>
    </g>
  </g>
</svg>
